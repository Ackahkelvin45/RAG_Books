# Production / pilot: everything on one server behind Caddy (automatic HTTPS).
#   cp .env.production.example .env   # fill it in
#   docker compose -f docker-compose.prod.yml up -d --build
# Only Caddy is reachable from outside; Postgres and MinIO stay on the internal network.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: shepherd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shepherd"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    image: shepherd
    restart: unless-stopped
    command: api
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/shepherd
      APP_DATABASE_URL: postgresql://shepherd_app:${APP_DB_PASSWORD}@postgres:5432/shepherd
      S3_ENDPOINT: http://minio:9000
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env (openssl rand -hex 32)}
    volumes:
      - models:/models          # bge-m3 + reranker (~4.5 GB), downloaded once, shared with the worker
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }

  worker:
    image: shepherd
    restart: unless-stopped
    command: worker
    healthcheck: { disable: true }   # the image's check is for the API port
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/shepherd
      APP_DATABASE_URL: postgresql://shepherd_app:${APP_DB_PASSWORD}@postgres:5432/shepherd
      S3_ENDPOINT: http://minio:9000
    volumes:
      - models:/models
    depends_on:
      api: { condition: service_healthy }   # migrations have run by then

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}   # Caddy only; with your own nginx (docker-compose.nginx.yml) it is unused
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - api

  # nightly pg_dump into the shared backups volume, 14 days kept (see DEPLOY.md to restore)
  backup:
    image: pgvector/pgvector:pg16   # same major version as the server, so pg_dump matches
    restart: unless-stopped
    healthcheck: { disable: true }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/shepherd-$$(date +%F).sql.gz
          pg_dump "$$DATABASE_URL" | gzip > "$$f.tmp" && mv "$$f.tmp" "$$f" && echo "backup $$f"
          find /backups -name 'shepherd-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/shepherd
    volumes:
      - backups:/backups
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
  models:
  backups:
  caddydata:
