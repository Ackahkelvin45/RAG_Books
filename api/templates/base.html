<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>First Love Church admin</title>
<style>
 body{font:15px/1.45 system-ui,sans-serif;margin:0;background:#f6f6f4;color:#222}
 header{background:#1f3a5f;color:#fff;padding:.7rem 1.2rem;display:flex;gap:1.2rem;align-items:center}
 header a{color:#fff;text-decoration:none;opacity:.85}header a.on,header a:hover{opacity:1;font-weight:600}
 header form{margin-left:auto}main{max-width:1100px;margin:1.2rem auto;padding:0 1rem}
 table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:.45rem .6rem;border-bottom:1px solid #e3e3e0;text-align:left;vertical-align:top}
 th{font-size:.8rem;text-transform:uppercase;color:#666}.card{background:#fff;padding:1rem;border:1px solid #e3e3e0;border-radius:6px;margin-bottom:1.2rem}
 input,select{padding:.35rem .5rem;border:1px solid #bbb;border-radius:4px;font:inherit}button{padding:.35rem .7rem;border:0;border-radius:4px;background:#1f3a5f;color:#fff;font:inherit;cursor:pointer}
 button.quiet{background:#e8e8e5;color:#222}button.danger{background:#a33}.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:end}.row label{display:flex;flex-direction:column;font-size:.8rem;color:#555}
 .flash{background:#fff7d6;border:1px solid #e8d48a;padding:.6rem .8rem;border-radius:4px;margin-bottom:1rem}
 .pill{display:inline-block;padding:.05rem .5rem;border-radius:99px;font-size:.78rem;background:#eee}.ready{background:#d9f2dc}.failed{background:#f6d5d5}.pending,.processing{background:#fdebc8}
 small{color:#666}.inline{display:inline}
</style></head><body>
<header><strong>First Love Church admin</strong>
 <a href="/admin/books" class="{{ 'on' if active=='books' }}">Books</a>
 <a href="/admin/users" class="{{ 'on' if active=='users' }}">Users</a>
 <a href="/admin/activity" class="{{ 'on' if active=='activity' }}">Activity</a>
 {% if active %}<form method="post" action="/admin/logout"><button class="quiet">Log out</button></form>{% endif %}
</header>
<main>{% if flash %}<div class="flash">{{ flash }}</div>{% endif %}{% block body %}{% endblock %}</main>
</body></html>
