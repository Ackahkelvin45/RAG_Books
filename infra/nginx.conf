# Shepherd Guide behind your own nginx. Put this in /etc/nginx/sites-available/shepherd and enable it;
# get the certificate with certbot (`certbot --nginx -d guide.example.org`), which fills in the ssl_ lines.
server {
    listen 80;
    server_name guide.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name guide.example.org;
    # ssl_certificate     /etc/letsencrypt/live/guide.example.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/guide.example.org/privkey.pem;

    client_max_body_size 50m;          # book uploads in the admin portal

    location / {
        proxy_pass         http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # answers stream as server-sent events: no buffering, and allow a slow answer to finish
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }
}
