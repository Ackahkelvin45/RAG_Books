[project]
name = "shepherd-guide"
version = "0.1.0"
description = "Grounded, cited retrieval over a church's own books."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "python-dotenv>=1.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pythonbible>=0.13",
    "sentence-transformers>=3.0",
    "torch>=2.4",   # listed directly so [tool.uv.sources] can pin the CPU build on Linux
    "boto3>=1.34",
    "openai>=3.16.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "itsdangerous>=2.2.0",
    "pymupdf>=1.28.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

# Servers are CPU-only: the CUDA build of torch (several GB of NVIDIA wheels) is never needed there.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared/shepherd", "worker", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "shared"]
